<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Navy Background Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="#0A2540" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- 4-Point Golden Star -->
  <polygon points="32,8 37,27 56,32 37,37 32,56 27,37 8,32 27,27" fill="url(#starGrad)" filter="url(#glow)" />
  
  <!-- Center Accent Spark -->
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" opacity="0.9" />
</svg>